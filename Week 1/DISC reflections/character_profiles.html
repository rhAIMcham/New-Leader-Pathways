<!DOCTYPE html>
<html lang="en">
<head>
<title>Character Impressions</title>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
<style>
  :root{
    --AIMblue: #4353A3;
    --darkBlue: #38416D;
    --teal: #5DC8B9;
    --cream: #F1EEDE;
    --grey: #ebebeb;
    --rust: #AF4510;
    --navy: #12195C;
    --white: #ffffff;
    --lightBlue: #AEBAE4;
  }

  ul {
        margin-left: 15px;
  }
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "IBM Plex Sans", sans-serif;
    padding: 20px;
    min-height: 100vh;
    /* background: var(--grey); */
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    background: white;
    border-radius: 12px;
    padding: 30px;
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
  }

  h1 {
    color: var(--darkBlue);
    margin-bottom: 10px;
    font-size: 28px;
    width: 100%;
  }

  .character-card {
    width: calc(50% - 12px);
    background: #f7fafc;
    border-radius: 8px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .character-name {
    font-weight: 600;
    font-size: 18px;
    color: var(--navy);
  }

  .character-info {
    color: #4a5568;
    line-height: 1.6;
    font-size: 14px;
  }

  textarea {
    width: 100%;
    min-height: 120px;
    padding: 12px;
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 14px;
    color: var(--darkBlue);
    border: 2px solid var(--lightBlue);
    border-radius: 8px;
    resize: vertical;
    transition: border-color 0.2s ease;
  }

  textarea:focus {
    outline: none;
    border-color: var(--AIMblue);
  }

  button.save-btn {
    position: relative;
    align-self: flex-start;
    color: white;
    background: var(--navy);
    width: 140px;
    border: solid 2px var(--cream);
    border-radius: 8px;
    margin-top: 4px;
    cursor: pointer;
    padding: 10px;
    font-size: 0.95rem;
    font-family: "IBM Plex Sans", sans-serif;
    transition: all 0.2s ease;
  }

  button.save-btn:hover {
    background-color: var(--lightBlue);
    color: var(--navy);
    border: solid 2px var(--navy);
  }

  button.save-btn.sent {
    background-color: var(--teal);
    border-color: var(--teal);
    color: var(--navy);
  }


   .saved {
    display: flex;
    justify-content: space-between; 
    align-items: center; 
    margin-top: 0.5rem;
 }

 .savedMsg {
 font-size: 0.9rem;
color: var(--lightBlue);
 opacity: 0;
 transition: opacity 0.4s ease;
 margin: 0;
 min-width: 60px;   
 }

 .saveBtn {
background-color: var(--navy); 
color: white; 
border: none; 
border-radius: 6px;
      padding: 0.5rem 1.25rem; 
      font-size: 1rem; 
      cursor: pointer;
 }

 
  @media (max-width: 768px) {
    .character-card {
      width: 100%;
    }
  }
</style>
</head>
<body>
<div class="container">
  <h1 style="margin-left: 10px;">Character Impressions</h1>

  <div class="character-card" data-character="daniel">
    <div class="character-name">Daniel J</div>
    <div class="character-info">
        <!-- <ul>
            <li>DISC profile: D (Dominance)
            <li>Primary motivation: Recognition, influence, and achievement
            <li>Strengths: Decisive action, experience, confidence
            <li>Development areas: Accepting feedback, collaboration, emotional intelligence
            <li>Attitude: Sceptical and competitive
        </ul> -->
    </div>
    <textarea placeholder="What is your impression of Daniel?" id="notes1" tabindex="0"></textarea>
      <div class="saved" >
    <p id="statusMsg1" class="savedMsg">Saved!</p>
    <button id="saveBtn1" class="saveBtn" tabindex="0">Save</button>
  </div>
  </div>

  <div class="character-card" data-character="imogen">
    <div class="character-name">Imogen E</div>
    <div class="character-info">
        <!-- <ul>
            <li>DISC profile: I (Influence)
            <li>Primary motivation: Connection, collaboration, recognition
            <li>Strengths: Positive, enthusiastic, persuasive, team-oriented
            <li>Development areas: Accountability, professional boundaries
            <li>Attitude: Friendly, informal, overly familiar
        </ul> -->
    </div>
    <textarea placeholder="What is your impression of Imogen?" id="notes2" tabindex="0"></textarea>
     <div class="saved" >
    <p id="statusMsg2" class="savedMsg">Saved!</p>
    <button id="saveBtn2" class="saveBtn" tabindex="0">Save</button>
  </div>
  </div>

  <div class="character-card" data-character="sam">
    <div class="character-name">Sam S</div>
    <div class="character-info">
        <!-- <ul>
            <li>DISC profile: S (Steadiness)
            <li>Primary motivation: Stability, teamwork, and reliability
            <li>Strengths: Loyal, dependable, patient, supportive
            <li>Development areas: Communication, advocacy, assertiveness
            <li>Attitude towards participant: Cautious and reserved
        </ul> -->
    </div>
    <textarea placeholder="What is your impression of Sam?"  id="notes3" tabindex="0"></textarea>
     <div class="saved" >
    <p id="statusMsg3" class="savedMsg">Saved!</p>
    <button id="saveBtn3" class="saveBtn" tabindex="0">Save</button>
  </div>
  </div>

  <div class="character-card" data-character="chaya">
    <div class="character-name">Chaya D</div>
    <div class="character-info">
        <!-- <ul>
            <li>DISC profile: C (Conscientiousness)
            <li>Primary motivation: Accuracy, quality, predictability
            <li>Strengths: Methodical, independent, reliable
            <li>Development areas: Adaptability, collaboration, communication
            <li>Attitude towards participant: Professional but distant
        </ul> -->
    </div>
    <textarea placeholder="What is your impression of Chaya?"  id="notes4" tabindex="0"></textarea>
     <div class="saved" >
    <p id="statusMsg4" class="savedMsg">Saved!</p>
    <button id="saveBtn4" class="saveBtn" tabindex="0">Save</button>
  </div>
  </div>
</div>

<script>
  // In-memory store standing in for localStorage inside this preview
  // (browser storage isn't available in the artifact sandbox). Drop this
  // in as your real localStorage in your own environment — the API is
  // identical, just swap `memoryStore` calls for `localStorage` calls.
  function initCharacterBox(inputId, btnId, msgId, storageKey) {
  const textArea = document.getElementById(inputId);
  const saveBtn = document.getElementById(btnId);
  const statusMsg = document.getElementById(msgId);

  const STORAGE_KEY = storageKey;

  // Load existing note (if any)
  const savedNote = localStorage.getItem(STORAGE_KEY);
  if (savedNote) textArea.value = savedNote;

  // Save on button click
  saveBtn.addEventListener('click', () => {
    localStorage.setItem(STORAGE_KEY, textArea.value.trim());

    // Fade in "Saved!"
    statusMsg.style.opacity = '1';
    setTimeout(() => statusMsg.style.opacity = '0', 1500);
  });

  // Optional: auto-save while typing
  textArea.addEventListener('input', () => {
    localStorage.setItem(STORAGE_KEY, textArea.value.trim());
  });textArea
}

initCharacterBox('notes1', 'saveBtn1', 'statusMsg1', 'danielProfile');
initCharacterBox('notes2', 'saveBtn2', 'statusMsg2', 'imogenProfile');
initCharacterBox('notes3', 'saveBtn3', 'statusMsg3', 'samProfile');
initCharacterBox('notes4', 'saveBtn4', 'statusMsg4', 'chayaProfile');
</script>
</body>
</html>
